services:
  # PostgreSQL с расширением TimescaleDB для временных рядов
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: myhouse-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-myhouse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - myhouse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis — не используется FastAPI; только для локальной отладки (--profile dev)
  redis:
    profiles: ["dev"]
    image: redis:7-alpine
    container_name: myhouse-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - myhouse-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myhouse-backend
    environment:
      PORT: ${BACKEND_PORT:-8000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-myhouse}
      ML_SERVICE_URL: http://ml:8002
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - myhouse-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  ml:
    build: ./ml
    container_name: myhouse-ml
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-myhouse}
    ports:
      - "8002:8002"
    volumes:
      - ml_data:/data/ml_results
      - ./ml/saved_models:/app/saved_models
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myhouse-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myhouse-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - myhouse-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ml_data:
    driver: local

networks:
  myhouse-network:
    driver: bridge
